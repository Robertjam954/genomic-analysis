[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "genomic-analysis-scripts"
version = "0.1.0"
description = "Genomic data analysis pipeline: data processing, exploratory analysis, survival modeling, and visualization"
readme = "README.md"
license = {file = "LICENCE"}
requires-python = ">=3.10"
authors = [
    {name = "Robert James"},
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.23",
    "matplotlib>=3.6",
    "seaborn>=0.12",
    "lifelines>=0.27",
    "xgboost>=1.7",
    "openpyxl>=3.1",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "black>=23.0",
    "ruff>=0.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
